name: Build Grev Home

on:
  push:
    branches:
      - main
      - 'agent/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build .\src\GrevHome\GrevHome.csproj --configuration Release --nologo

      - name: Verify account restore isolation
        run: dotnet run --project .\tests\AccountRestore\AccountRestore.csproj --configuration Release

      - name: Verify storage and input hardening
        run: dotnet run --project .\tests\Hardening\Hardening.csproj --configuration Release

      - name: Verify GrevCo install layout
        shell: pwsh
        run: |
          dotnet run --project .\tests\InstallLayout\InstallLayout.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Install layout regression test failed.' }
          $legacyRootReferences = Get-ChildItem .\src,.\installer -Recurse -File | Where-Object { $_.Extension -in '.cs','.xaml','.iss' } | Select-String -SimpleMatch 'C:\GrevHome'
          if ($legacyRootReferences) {
            $legacyRootReferences | ForEach-Object { Write-Host "Legacy root reference: $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Production source still contains the legacy C:\GrevHome root.'
          }

      - name: Verify no theme colors are hardcoded outside the theme engine
        shell: pwsh
        run: |
          # Covers both spellings a color literal can take in this codebase: a XAML/string hex
          # code, and the equivalent decimal Color.FromRgb(r, g, b) used in C# object initializers.
          # The FromRgb form is how this exact duplication got past the first version of this
          # guard: same color, different syntax, so the hex-only pattern below missed it entirely.
          # ThemeCreatorView's own quick-pick swatch palette legitimately contains #7EA6FF as one
          # offered color among ten, the same way DashboardTileSettingsView's presets do - not a
          # chrome duplicate.
          $themeColorFiles = 'src\GrevHome\App.xaml','src\GrevHome\Presentation\ThemeDefinition.cs','src\GrevHome\Presentation\AppArtworkFactory.cs','src\GrevHome\Profiles\ProfilePresentationSettings.cs','src\GrevHome\Views\ThemeCreatorView.xaml.cs'
          $strayThemeColors = Get-ChildItem .\src -Recurse -File -Include *.cs,*.xaml |
            Where-Object { $themeColorFiles -notcontains $_.FullName.Substring((Resolve-Path .).Path.Length + 1) } |
            Select-String -Pattern '#090C12|#11151E|#2B3344|#343D51|#3A465F|#7EA6FF|FromRgb\(9, ?12, ?18\)|FromRgb\(17, ?21, ?30\)|FromRgb\(43, ?51, ?68\)|FromRgb\(52, ?61, ?81\)|FromRgb\(58, ?70, ?95\)|FromRgb\(126, ?166, ?255\)|FromRgb\(151, ?160, ?179\)'
          if ($strayThemeColors) {
            $strayThemeColors | ForEach-Object { Write-Host "Stray theme color literal: $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'A shell chrome color is hardcoded outside the theme engine, as a hex string or a decimal Color.FromRgb. Use the matching theme brush (DynamicResource in XAML, (Brush)FindResource in code-behind) instead so themes actually reach it.'
          }

      - name: Verify official installer publishers without executing installers
        run: dotnet run --project .\tests\Hardening\Hardening.csproj --configuration Release -- --official-installers

      - name: Verify profile carousel and password keyboard
        run: dotnet run --project .\tests\ProfileCarousel\ProfileCarousel.csproj --configuration Release

      - name: Verify public profile and friends customisation
        run: dotnet run --project .\tests\ProfileSocial\ProfileSocial.csproj --configuration Release

      - name: Verify profile tile grid contract and controller-first editing
        run: dotnet run --project .\tests\ProfileTiles\ProfileTiles.csproj --configuration Release

      - name: Install Inno Setup
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Build installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: .\installer\build-installer.ps1

      - name: Upload installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: GrevHome-Installer
          path: |
            dist/GrevHomeSetup.exe
            dist/GrevHomeSetup.sha256.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/GrevHomeSetup.exe dist/GrevHomeSetup.sha256.txt --title "Grev Home ${{ github.ref_name }}" --generate-notes --verify-tag

      - name: Publish installer for a new main version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          [xml]$project = Get-Content src/GrevHome/GrevHome.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A three-part release version is required.' }
          $tag = "v$version"
          $existing = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases.' }
          if ($existing -contains $tag) {
            Write-Host "Release $tag already exists. Increase the project and installer versions for the next update."
            exit 0
          }
          gh release create $tag dist/GrevHomeSetup.exe dist/GrevHomeSetup.sha256.txt --target $env:RELEASE_COMMIT --title "Grev Home $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Installer release publishing failed.' }
