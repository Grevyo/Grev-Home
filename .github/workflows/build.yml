name: Build Grev Home

on:
  push:
    branches:
      - main
      - 'agent/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build .\src\GrevHome\GrevHome.csproj --configuration Release --nologo

      - name: Verify account restore isolation
        run: dotnet run --project .\tests\AccountRestore\AccountRestore.csproj --configuration Release

      - name: Verify storage and input hardening
        run: dotnet run --project .\tests\Hardening\Hardening.csproj --configuration Release

      - name: Verify official installer publishers without executing installers
        run: dotnet run --project .\tests\Hardening\Hardening.csproj --configuration Release -- --official-installers

      - name: Verify profile carousel and password keyboard
        run: dotnet run --project .\tests\ProfileCarousel\ProfileCarousel.csproj --configuration Release

      - name: Install Inno Setup
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Build installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: .\installer\build-installer.ps1

      - name: Upload installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: GrevHome-Installer
          path: |
            dist/GrevHomeSetup.exe
            dist/GrevHomeSetup.sha256.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/GrevHomeSetup.exe dist/GrevHomeSetup.sha256.txt --title "Grev Home ${{ github.ref_name }}" --generate-notes --verify-tag

      - name: Publish installer for a new main version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          [xml]$project = Get-Content src/GrevHome/GrevHome.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A three-part release version is required.' }
          $tag = "v$version"
          $existing = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases.' }
          if ($existing -contains $tag) {
            Write-Host "Release $tag already exists. Increase the project and installer versions for the next update."
            exit 0
          }
          gh release create $tag dist/GrevHomeSetup.exe dist/GrevHomeSetup.sha256.txt --target $env:RELEASE_COMMIT --title "Grev Home $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Installer release publishing failed.' }
