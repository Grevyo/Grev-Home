name: Build Grev Home

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build .\src\GrevHome\GrevHome.csproj --configuration Release --nologo

      - name: Validate release PowerShell
        shell: pwsh
        run: |
          $files = @(
            '.\tools\Publish-GrevHome.ps1',
            '.\tools\Install-GrevHome.ps1',
            '.\tools\Uninstall-GrevHome.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $file"
            }
          }

      - name: Publish self-contained Windows payload
        shell: pwsh
        run: .\tools\Publish-GrevHome.ps1 -OutputPath .\artifacts\GrevHome-win-x64

      - name: Verify release payload
        shell: pwsh
        run: |
          $required = @(
            '.\artifacts\GrevHome-win-x64\GrevHome.exe',
            '.\artifacts\GrevHome-win-x64\Install-GrevHome.ps1',
            '.\artifacts\GrevHome-win-x64\Uninstall-GrevHome.ps1'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Release payload is missing $path"
            }
          }
