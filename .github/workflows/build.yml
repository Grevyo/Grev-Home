name: Build Grev Home

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build .\src\GrevHome\GrevHome.csproj --configuration Release --nologo
