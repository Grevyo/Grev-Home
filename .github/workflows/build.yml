name: Build Grev Home

on:
  push:
    branches:
      - main
      - 'agent/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build .\src\GrevHome\GrevHome.csproj --configuration Release --nologo

      - name: Verify account restore isolation
        run: dotnet run --project .\tests\AccountRestore\AccountRestore.csproj --configuration Release

      - name: Verify storage and input hardening
        run: dotnet run --project .\tests\Hardening\Hardening.csproj --configuration Release

      - name: Verify official installer publishers without executing installers
        run: dotnet run --project .\tests\Hardening\Hardening.csproj --configuration Release -- --official-installers

      - name: Verify profile carousel and password keyboard
        run: dotnet run --project .\tests\ProfileCarousel\ProfileCarousel.csproj --configuration Release

      - name: Install Inno Setup
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Build installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: .\installer\build-installer.ps1

      - name: Upload installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: GrevHome-Installer
          path: |
            dist/GrevHomeSetup.exe
            dist/GrevHomeSetup.sha256.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/GrevHomeSetup.exe dist/GrevHomeSetup.sha256.txt --title "Grev Home ${{ github.ref_name }}" --generate-notes --verify-tag
